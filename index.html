<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f8d84a"><title>Pokémon ABC-Abenteuer</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#26334a;background:#f6f8ff}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:16px 16px 38px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:clamp(23px,5vw,34px);font-weight:900;color:#2556a7}.pill{background:white;border-radius:30px;padding:10px 15px;font-weight:800;box-shadow:0 3px 12px #0001}.panel{background:white;border-radius:25px;padding:clamp(15px,4vw,30px);box-shadow:0 8px 30px #23345b16;margin-top:18px;text-align:center}h1{font-size:clamp(25px,5vw,36px);margin:8px 0}p{line-height:1.45}.sub{color:#65718b}.pokemon{width:min(230px,60vw);height:220px;object-fit:contain;filter:drop-shadow(0 8px 8px #1a2b4c25)}button{border:0;border-radius:16px;padding:13px 18px;background:#ffd94b;color:#253452;font:800 20px system-ui;cursor:pointer;touch-action:manipulation;min-height:55px}button:active{transform:scale(.97)}button:disabled{opacity:.45}button.secondary{background:#eaf0ff}button.primary{background:#3765d8;color:white}button.good{background:#3bbf79;color:white}.row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px}.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:18px 0}.slot{width:clamp(30px,8vw,55px);height:58px;border-bottom:4px solid #6482c0;font-size:clamp(23px,5vw,34px);font-weight:900;display:grid;place-items:center}.letters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;max-width:480px;margin:18px auto}.letters button{padding:5px;font-size:clamp(23px,6vw,33px);background:#e7efff}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:15px auto;max-width:540px}.choice{background:#f4f7ff;border:4px solid transparent;border-radius:18px;min-height:165px;padding:8px}.choice img{width:100%;height:140px;object-fit:contain}.choice.correct{border-color:#2aba70}.choice.wrong{border-color:#f18c8c}.feedback{font-size:20px;font-weight:800;min-height:35px;color:#3155a0}.tracebox{position:relative;max-width:410px;margin:12px auto;background:#f8fbff;border:3px solid #dbe5f7;border-radius:20px;overflow:hidden;touch-action:none}.tracebox svg{width:100%;display:block;touch-action:none}.tracebox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.progress{height:13px;border-radius:20px;background:#e7edfb;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#52bf8b;transition:width .25s}.hidden{display:none!important}.footer{margin-top:16px;color:#77839c;font-size:12px;text-align:center}.small{font-size:14px}.tag{background:#e8efff;color:#3765a7;border-radius:20px;padding:6px 12px;font-weight:800;display:inline-block} @media(max-width:390px){.choice img{height:110px}.choice{min-height:130px}.slot{height:48px}}
</style></head><body><main><header><div class="brand">⚡ Pokémon ABC</div><div class="pill">⭐ <span id="score">0</span></div></header><section class="panel" id="app"></section><div class="footer">Privates Lernprojekt · Pokémon-Grafiken © jeweilige Rechteinhaber · Internet für Bilder erforderlich</div></main><script>
'use strict';
const P=[['Pikachu',25],['Evoli',133],['Mew',151],['Glumanda',4],['Schiggy',7],['Bisasam',1],['Raupy',10],['Taubsi',16],['Rattfratz',19],['Pummeluff',39],['Vulpix',37],['Enton',54],['Mauzi',52],['Digda',50],['Abra',63],['Onix',95],['Lapras',131],['Relaxo',143],['Ditto',132],['Karpador',129]];
const app=document.getElementById('app');let score=Number(localStorage.getItem('pokeabc-score')||0),round=0,target=null,typed='',pool=[],traceIndex=0,traceDone=false,tracePoints=[],traceActive=false,traceStrokes=0,chosen=-1;const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function updateScore(){document.getElementById('score').textContent=score}function addScore(n){score+=n;localStorage.setItem('pokeabc-score',score);updateScore()}
function img(p){return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p[1]}.png`}
function speak(t){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.78;u.pitch=1.12;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith('de'))||null;speechSynthesis.speak(u)}
function random(arr){return arr[Math.floor(Math.random()*arr.length)]}function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}function b(label,fn,cls=''){const el=document.createElement('button');el.textContent=label;el.className=cls;el.addEventListener('click',fn);return el}
function resetView(html){app.innerHTML=html}function home(){resetView(`<div class="tag">Lesen · Schreiben · Sammeln</div><h1>Dein Pokémon-Abenteuer!</h1><p class="sub">Finde Pokémon, schreibe ihre Namen mit dem Finger und sammle Sterne.</p><img class="pokemon" alt="Pikachu" src="${img(P[0])}"><p>🎯 Eine Runde: <strong>Schreiben → Nachzeichnen → Lesen</strong></p><div id="actions" class="row"></div><p class="small sub">Tipp: Ton am iPad einschalten. Die Vorlesestimme kommt aus deinem Gerät.</p>`);document.getElementById('actions').append(b('▶ Losspielen!',()=>{round=0;newWrite()},'primary'))}
function newWrite(){target=random(P.filter(p=>p[0].length<=8));typed='';const name=target[0].toUpperCase();pool=shuffle([...name,...shuffle([...alphabet].filter(c=>!name.includes(c))).slice(0,Math.max(3,10-name.length))].map((c,i)=>({c,i,used:false}));renderWrite();}
function renderWrite(msg=''){const name=target[0].toUpperCase();resetView(`<div class="tag">✏️ Spiel 1 · Namen schreiben</div><h1>Wie heiße ich?</h1><img class="pokemon" alt="Pokémon zum Erraten" src="${img(target)}"><div id="talk" class="row"></div><div class="slots" id="slots"></div><div class="letters" id="letters"></div><div class="feedback" id="feedback"></div><div id="actions" class="row"></div>`);document.getElementById('talk').append(b('🔊 Namen anhören',()=>speak(target[0]),'secondary'));const slots=document.getElementById('slots');for(let i=0;i<name.length;i++){const s=document.createElement('div');s.className='slot';s.textContent=typed[i]||'';slots.append(s)}const letters=document.getElementById('letters');pool.forEach((x,i)=>{const btn=b(x.c,()=>chooseLetter(i));btn.disabled=x.used;letters.append(btn)});document.getElementById('feedback').textContent=msg;document.getElementById('actions').append(b('↩ Buchstabe zurück',()=>{if(!typed)return;const c=typed.at(-1);typed=typed.slice(0,-1);const entry=[...pool].reverse().find(x=>x.c===c&&x.used);if(entry)entry.used=false;renderWrite()},'secondary'))}
function chooseLetter(i){const x=pool[i];if(x.used)return;const expected=target[0].toUpperCase()[typed.length];if(x.c!==expected){document.getElementById('feedback').textContent='Fast! Probiere einen anderen Buchstaben. 💛';return}x.used=true;typed+=x.c;if(typed.length===target[0].length){resetView(`<h1>🎉 Super gemacht!</h1><img class="pokemon" src="${img(target)}" alt="${target[0]}"><p>Du hast <strong>${target[0].toUpperCase()}</strong> richtig geschrieben!</p><div id="actions"></div>`);speak('Super! '+target[0]+'. Jetzt schreiben wir die Buchstaben mit dem Finger.');setTimeout(()=>startTrace(),1600)}else renderWrite('Prima, weiter so!')}
// Trace templates use SVG paths, each letter is a simple single-stroke guide.
const paths={A:'M 50 165 L 100 35 L 150 165 M 68 115 L 132 115',B:'M 55 165 L 55 35 L 110 35 Q 155 35 145 70 Q 140 95 55 95 M 55 95 L 115 95 Q 160 95 150 135 Q 145 165 55 165',C:'M 145 50 Q 60 10 50 95 Q 50 180 145 150',D:'M 55 165 L 55 35 L 95 35 Q 165 35 160 100 Q 160 165 95 165 Z',E:'M 150 35 L 55 35 L 55 165 L 150 165 M 55 100 L 125 100',F:'M 55 165 L 55 35 L 150 35 M 55 100 L 125 100',G:'M 145 55 Q 55 10 50 100 Q 50 180 145 155 L 145 110 L 110 110',H:'M 55 35 L 55 165 M 145 35 L 145 165 M 55 100 L 145 100',I:'M 65 35 L 135 35 M 100 35 L 100 165 M 65 165 L 135 165',J:'M 145 35 L 145 130 Q 145 175 95 165 Q 60 160 55 135',K:'M 55 35 L 55 165 M 150 35 L 55 105 L 150 165',L:'M 55 35 L 55 165 L 150 165',M:'M 45 165 L 45 35 L 100 100 L 155 35 L 155 165',N:'M 50 165 L 50 35 L 150 165 L 150 35',O:'M 100 35 C 20 35 20 165 100 165 C 180 165 180 35 100 35 Z',P:'M 55 165 L 55 35 L 115 35 Q 170 35 155 85 Q 145 110 55 110',Q:'M 100 35 C 20 35 20 165 100 165 C 180 165 180 35 100 35 Z M 120 135 L 160 175',R:'M 55 165 L 55 35 L 115 35 Q 170 35 155 85 Q 145 110 55 110 M 105 110 L 155 165',S:'M 150 50 Q 50 10 50 75 Q 50 105 105 105 Q 170 110 150 145 Q 125 185 50 150',T:'M 40 35 L 160 35 M 100 35 L 100 165',U:'M 50 35 L 50 125 Q 50 180 100 165 Q 150 165 150 125 L 150 35',V:'M 45 35 L 100 165 L 155 35',W:'M 35 35 L 60 165 L 100 90 L 140 165 L 165 35',X:'M 45 35 L 155 165 M 155 35 L 45 165',Y:'M 45 35 L 100 100 L 155 35 M 100 100 L 100 165',Z:'M 45 35 L 155 35 L 45 165 L 155 165'};
function startTrace(){traceIndex=0;showTrace()}
function showTrace(){traceDone=false;tracePoints=[];traceStrokes=0;const name=target[0].toUpperCase(),letter=name[traceIndex];resetView(`<div class="tag">🖍️ Finger-Schreiben</div><h1>Zeichne das ${letter} nach!</h1><p class="sub">Folge der gestrichelten Linie. Beginne beim grünen Punkt.</p><div class="progress"><div style="width:${traceIndex/name.length*100}%"></div></div><p><strong>Buchstabe ${traceIndex+1} von ${name.length}</strong> · ${name}</p><div class="tracebox"><svg viewBox="0 0 200 200" aria-label="Schreibvorlage für ${letter}"><path d="${paths[letter]}" stroke="#a9b9d8" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="${paths[letter]}" stroke="#fff" stroke-width="2.5" stroke-dasharray="5 7" fill="none"/><circle cx="${startPoint(letter)[0]}" cy="${startPoint(letter)[1]}" r="9" fill="#20b76e"/><text x="${startPoint(letter)[0]}" y="${startPoint(letter)[1]+4}" font-size="11" text-anchor="middle" fill="white" font-weight="bold">1</text></svg><canvas id="draw"></canvas></div><div class="feedback" id="feedback">Zeichne mit dem Finger auf die Vorlage.</div><div id="actions" class="row"></div>`);const actions=document.getElementById('actions');actions.append(b('↺ Neu versuchen',()=>showTrace(),'secondary'));const next=b(traceIndex===name.length-1?'⭐ Fertig!':'Weiter →',()=>{if(traceIndex===name.length-1){addScore(1);showSuccess()}else{traceIndex++;showTrace()}},'good');next.disabled=true;actions.append(next);const canvas=document.getElementById('draw'),ctx=canvas.getContext('2d');canvas.width=400;canvas.height=400;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#2867dd';ctx.lineWidth=12;let last=null;function pos(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*400,y:(e.clientY-r.top)/r.height*400}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);traceActive=true;last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);traceStrokes++});canvas.addEventListener('pointermove',e=>{if(!traceActive)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();tracePoints.push(p);last=p});canvas.addEventListener('pointerup',()=>{traceActive=false;checkTrace()});canvas.addEventListener('pointercancel',()=>{traceActive=false;checkTrace()});function checkTrace(){if(tracePoints.length<8)return;const guide=document.querySelector('.tracebox svg path');const len=guide.getTotalLength();let hits=0;const samples=30;for(let i=0;i<samples;i++){const g=guide.getPointAtLength(len*i/(samples-1));if(tracePoints.some(p=>Math.hypot(p.x/2-g.x,p.y/2-g.y)<23))hits++}const coverage=hits/samples;if(coverage>=.55){next.disabled=false;document.getElementById('feedback').textContent='🌟 Toll nachgezeichnet! Weiter geht’s.'}else{document.getElementById('feedback').textContent='Gut angefangen! Fahre noch mehr von der Linie nach.'}}}
function startPoint(l){const m=paths[l].match(/M\s*(\d+)\s*(\d+)/);return [+m[1],+m[2]]}
function showSuccess(){resetView(`<h1>🌟 Geschafft!</h1><img class="pokemon" src="${img(target)}" alt="${target[0]}"><p>Du hast <strong>${target[0]}</strong> geschrieben und nachgezeichnet.</p><p>⭐ +1 Stern!</p><div id="actions"></div>`);speak('Klasse! Ein Stern für dich!');document.getElementById('actions').append(b('📖 Jetzt lesen!',newRead,'primary'))}
function newRead(){target=random(P);chosen=-1;const options=shuffle([target,...shuffle(P.filter(p=>p!==target)).slice(0,3)]);resetView(`<div class="tag">📖 Spiel 2 · Namen lesen</div><h1>Finde ${target[0].toUpperCase()}!</h1><p class="sub">Lies den Namen und tippe auf das richtige Bild.</p><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div id="actions" class="row"></div>`);const choices=document.getElementById('choices');options.forEach((p,i)=>{const btn=document.createElement('button');btn.className='choice';btn.setAttribute('aria-label','Pokémon Bild '+(i+1));btn.innerHTML=`<img alt="Auswahl ${i+1}" src="${img(p)}">`;btn.addEventListener('click',()=>{if(chosen!==-1)return;if(p===target){chosen=i;btn.classList.add('correct');addScore(1);document.getElementById('feedback').textContent='🎉 Richtig! +1 Stern';speak('Richtig! Das ist '+target[0]);document.getElementById('actions').append(b('✏️ Nächstes Pokémon!',()=>{round++;newWrite()},'primary'))}else{btn.classList.add('wrong');document.getElementById('feedback').textContent='Versuche es noch einmal!';setTimeout(()=>btn.classList.remove('wrong'),700)}});choices.append(btn)});document.getElementById('actions').append(b('🔊 Namen anhören',()=>speak(target[0]),'secondary'))}
updateScore();home();
</script></body></html>
