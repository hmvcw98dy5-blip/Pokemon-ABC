function pathD(a){return a.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')}
function resample(a,n=60){const d=[0];for(let i=1;i<a.length;i++)d.push(d[i-1]+Math.hypot(a[i][0]-a[i-1][0],a[i][1]-a[i-1][1]));const length=d.at(-1)||1;return Array.from({length:n},(_,i)=>{const at=i/(n-1)*length;let j=1;while(j<d.length-1&&d[j]<at)j++;const f=(at-d[j-1])/((d[j]-d[j-1])||1);return [a[j-1][0]+f*(a[j][0]-a[j-1][0]),a[j-1][1]+f*(a[j][1]-a[j-1][1])]})}

function arrow(pts,parent,color='#e67b17',opacity=1){const p=pts[Math.min(13,pts.length-1)],q=pts[Math.min(19,pts.length-1)];const angle=Math.atan2(q[1]-p[1],q[0]-p[0]),len=19;const head=[p[0]+Math.cos(angle)*len,p[1]+Math.sin(angle)*len],l=[head[0]-Math.cos(angle-.57)*12,head[1]-Math.sin(angle-.57)*12],r=[head[0]-Math.cos(angle+.57)*12,head[1]-Math.sin(angle+.57)*12];el('path',{d:`M${p[0]} ${p[1]} L${head[0]} ${head[1]} M${l[0]} ${l[1]} L${head[0]} ${head[1]} L${r[0]} ${r[1]}`,fill:'none',stroke:color,'stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round',opacity},parent)}
function xy(e){const svg=$('board');const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return Object.values((()=>{const v=p.matrixTransform(svg.getScreenCTM().inverse());return {x:v.x,y:v.y}})())}
function bindTrace(){const svg=$('board');svg.addEventListener('pointerdown',e=>{if(playing||activeId!==null||strokeIndex>=traceStrokes.length)return;const p=xy(e),start=traceStrokes[strokeIndex].pts[0];if(Math.hypot(p[0]-start[0],p[1]-start[1])>31){message('Beginne bitte bei der gelben Zahl.');return}e.preventDefault();activeId=e.pointerId;svg.setPointerCapture(e.pointerId);current=[p];paintTrace()});svg.addEventListener('pointermove',e=>{if(e.pointerId!==activeId)return;e.preventDefault();const p=xy(e);if(Math.hypot(p[0]-current.at(-1)[0],p[1]-current.at(-1)[1])>1.5){current.push(p);paintTrace()}});svg.addEventListener('pointerup',e=>{if(e.pointerId!==activeId)return;activeId=null;const ref=traceStrokes[strokeIndex].pts,tail=ref.at(-1),end=current.at(-1);let matched=0,last=0;for(const q of ref){let found=-1;for(let i=last;i<current.length;i++){if(Math.hypot(q[0]-current[i][0],q[1]-current[i][1])<24){found=i;break}}if(found>=0){matched++;last=found}}const ok=current.length>5&&Math.hypot(end[0]-tail[0],end[1]-tail[1])<32&&matched/ref.length>.72;if(ok){drawn.push(ref);strokeIndex++;message(strokeIndex===traceStrokes.length?'🌟 Geschafft! Jetzt schreibst du den Namen ganz allein.':`Prima! Weiter mit Strich ${traceStrokes[strokeIndex].number} beim nächsten gelben Punkt.`);if(strokeIndex===traceStrokes.length)$('toFree').disabled=false}else message('Fast! Folge dem ganzen Strich in Pfeilrichtung bis zum Ende.');current=[];paintTrace()});svg.addEventListener('pointercancel',()=>{activeId=null;current=[];paintTrace()})}
function demo(){if(playing)return;stop();playing=true;strokeIndex=0;drawn=[];current=[];paintTrace();message('Schau genau zu: So führt der Stift jeden Strich.');let i=0,j=0;function tick(){if(!playing)return;if(i>=traceStrokes.length){playing=false;strokeIndex=0;drawn=[];current=[];paintTrace();message('Jetzt bist du dran! Starte bei der gelben 1.');return}strokeIndex=i;const pts=traceStrokes[i].pts;current=pts.slice(0,Math.max(2,j));paintTrace();j+=2;if(j>pts.length){drawn.push(pts);current=[];i++;j=0}animId=requestAnimationFrame(tick)}tick()}
function startFree(){stop();stage='free';freePaths=[];freeCurrent=[];freeWordShown=true;renderFree()}
function renderFree(){boardW=Math.max(1000,[...target[0]].length*135);boardH=360;app.innerHTML=`<div class="eyebrow">Du kannst das!</div><h1 class="title">Jetzt schreibst du allein!</h1>${progress(3)}<p class="sub">Schreibe <b>${esc(target[0])}</b> ohne Nachspurhilfe in die Häuserlinien.</p><div id="reference" class="pokename">${esc(target[0])}</div><div class="writing"><svg class="board free" id="board" viewBox="0 0 ${boardW} ${boardH}"><g id="house"></g><g id="freeInk"></g></svg></div><div class="legend">Dachgeschoss · Mittelgeschoss · Grundlinie · Keller. Nutze die gesamte Schreibfläche.</div><div class="message" id="message">Schreibe in deinem eigenen Tempo. Hier gibt es keine automatische Bewertung deiner Handschrift.</div><div class="actions" id="actions"></div>`;const house=$('house');for(const [y,col,dash,width] of [[58,'#83b6d9','',2],[145,'#93c6e1','8 8',2],[252,'#e58f96','',3],[322,'#a6c8dd','8 8',2]])el('line',{x1:0,y1:y,x2:boardW,y2:y,stroke:col,'stroke-width':width,'stroke-dasharray':dash},house);for(let x=0;x<boardW;x+=140)el('line',{x1:x,y1:58,x2:x,y2:322,stroke:'#e8eff6','stroke-width':1},house);bindFree();controls(btn('👁️ Vorlage ausblenden',toggleReference,'muted'),btn('↶ Rückgängig',()=>{freePaths.pop();paintFree()},'muted'),btn('↺ Löschen',()=>{freePaths=[];paintFree()},'muted'),btn('🌟 Fertig!',finish,'green'))}
function toggleReference(){freeWordShown=!freeWordShown;$('reference').classList.toggle('hide',!freeWordShown);$('actions').firstChild.textContent=freeWordShown?'👁️ Vorlage ausblenden':'👁️ Vorlage zeigen'}
function bindFree(){const svg=$('board');svg.addEventListener('pointerdown',e=>{if(activeId!==null)return;e.preventDefault();activeId=e.pointerId;svg.setPointerCapture(e.pointerId);freeCurrent=[xy(e)];paintFree()});svg.addEventListener('pointermove',e=>{if(activeId!==e.pointerId)return;e.preventDefault();const p=xy(e);if(Math.hypot(p[0]-freeCurrent.at(-1)[0],p[1]-freeCurrent.at(-1)[1])>1){freeCurrent.push(p);paintFree()}});svg.addEventListener('pointerup',e=>{if(activeId!==e.pointerId)return;activeId=null;if(freeCurrent.length>1)freePaths.push(freeCurrent);freeCurrent=[];paintFree()});svg.addEventListener('pointercancel',()=>{activeId=null;freeCurrent=[];paintFree()})}
function paintFree(){const g=$('freeInk');if(!g)return;g.replaceChildren();[...freePaths,...(freeCurrent.length?[freeCurrent]:[])].forEach(p=>{if(p.length>1)el('path',{d:pathD(p),fill:'none',stroke:'#286bd3','stroke-width':8,'stroke-linecap':'round','stroke-linejoin':'round'},g)})}
function finish(){if(!freePaths.length){message('Schreibe zuerst den Namen in die Linien.');return}score();stage='success';app.innerHTML=`<div class="complete">🏆</div><h1 class="title">Super gemacht!</h1><p class="sub">Du hast <b>${esc(target[0])}</b> entdeckt, gelegt, nachgespurt und selbst geschrieben!</p>${pokemonImg(target)}<div class="pokename">⭐ +1 Stern</div><div class="actions" id="actions"></div>`;controls(btn('🎮 Nächstes Pokémon',startGame,'primary'),btn('📖 Pokémon lesen',reading,'blue'),btn('⌂ Startseite',home,'muted'));speak('Super gemacht!')}
function reading(){stop();stage='read';readDone=false;readTarget=random(P);const opts=shuffle([readTarget,...shuffle(P.filter(p=>p!==readTarget)).slice(0,3)]);app.innerHTML=`<div class="eyebrow">Pokémon lesen</div><h1 class="title">Welches Pokémon ist das?</h1><div class="pokename">${esc(readTarget[0])}</div><p class="sub">Lies den Namen und tippe auf das richtige Bild.</p><div class="choicegrid" id="choicegrid"></div><div class="message" id="message"></div><div class="actions" id="actions"></div>`;opts.forEach(p=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<img src="${imageUrl(p)}" alt="Pokémon-Bild" onerror="this.style.display='none';this.parentNode.textContent='❔'">`;b.onclick=()=>{if(readDone)return;if(p===readTarget){readDone=true;b.classList.add('good');score();message('🌟 Richtig! Du bekommst einen Stern.');controls(btn('➡ Nächste Leserunde',reading,'green'),btn('✏️ Schreiben',startGame,'primary'))}else{b.classList.add('bad');message('Versuche es noch einmal!')}};$('choicegrid').append(b)});controls(btn('🔊 Namen anhören',()=>speak(readTarget[0]),'blue'),btn('⌂ Startseite',home,'muted'))}
home();
</script></body></html>
