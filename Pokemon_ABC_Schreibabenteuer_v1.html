const POKEMON=['Pikachu','Evoli','Glumanda','Schiggy','Bisasam','Relaxo'];
const LETTERS=[
{name:'a',paths:['M 379 204 C 345 175, 284 178, 262 211 C 232 257, 265 330, 313 330 C 356 330, 377 302, 377 262','M 379 204 L 379 330'],texts:['Oben rechts starten und die Rundung gegen den Uhrzeigersinn nachfahren.','Rechts oben neu ansetzen und den Abstrich nach unten ziehen.']},
{name:'m',paths:['M 210 175 L 210 330','M 210 207 C 229 168 268 165 290 199 C 302 216 300 270 300 330','M 300 207 C 319 168 358 165 380 199 C 392 216 390 270 390 330'],texts:['Links an der Mittellinie beginnen und nach unten schreiben.','Links am ersten Stamm ansetzen, den ersten Bogen nach rechts unten schreiben.','Am zweiten Stamm ansetzen und den nächsten Bogen nach rechts unten schreiben.']},
{name:'i',paths:['M 300 175 L 300 330','M 300 127 L 300 128'],texts:['An der Mittellinie beginnen und den geraden Strich bis zur Grundlinie schreiben.','Zum Schluss den i-Punkt setzen.']},
{name:'P',paths:['M 238 65 L 238 330','M 238 65 C 329 65 397 85 397 139 C 397 192 336 203 238 203'],texts:['An der Oberlinie beginnen und den Stamm bis zur Grundlinie ziehen.','Oben am Stamm neu ansetzen und den runden Bogen nach rechts und zurück zur Mittellinie schreiben.']}
];
const $=id=>document.getElementById(id),board=$('board'),group=$('paths'),trace=$('trace'),start=$('start');let letter=0,stroke=0,progress=0,active=false,samples=[],drawPaths=[],completed=[],anim=null,lastPokemon=-1,coords=[];
function el(tag,attrs){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}
function loadLetter(){if(anim)cancelAnimationFrame(anim);anim=null;stroke=0;active=false;progress=0;coords=[];group.replaceChildren();samples=[];drawPaths=[];completed=[];trace.setAttribute('d','');$('next').disabled=true;$('count').textContent=`${letter+1} / ${LETTERS.length}`;$('steps').innerHTML=LETTERS.map((_,i)=>`<span class="pill ${i<letter?'done':i===letter?'active':''}"></span>`).join('');for(let d of LETTERS[letter].paths){let path=el('path',{d,class:'guide'});let done=el('path',{d,class:'completed',display:'none'});group.append(path,done);drawPaths.push(path);completed.push(done);let len=path.getTotalLength();samples.push(Array.from({length:151},(_,i)=>path.getPointAtLength(len*i/150)))}update();$('feedback').textContent='Bereit? Beginne am blauen Punkt.'}
function update(){let L=LETTERS[letter];if(stroke>=L.paths.length){start.style.display='none';$('instruction').textContent=`Geschafft! Du hast das ${L.name} geschrieben! 🎉`;$('next').disabled=false;return}start.style.display='';let p=samples[stroke][0];start.setAttribute('cx',p.x);start.setAttribute('cy',p.y);$('instruction').textContent=`${L.name} · Schritt ${stroke+1} von ${L.paths.length}: ${L.texts[stroke]}`}
function point(e){let p=board.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let matrix=board.getScreenCTM();return p.matrixTransform(matrix.inverse())}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function renderTrace(){trace.setAttribute('d',coords.length?'M '+coords.map(p=>`${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L '):'')}
function down(e){if(anim||stroke>=samples.length)return;let p=point(e),s=samples[stroke][0];if(dist(p,s)>27){$('feedback').textContent='Beginne bitte am blauen Punkt.';return}e.preventDefault();board.setPointerCapture(e.pointerId);active=true;progress=0;coords=[s];renderTrace();$('feedback').textContent='Sehr gut, bleib auf der Linie!'}
function move(e){if(!active)return;e.preventDefault();let p=point(e),arr=samples[stroke],best=progress,bestDist=Infinity;for(let i=Math.max(0,progress-5);i<=Math.min(arr.length-1,progress+27);i++){let d=dist(p,arr[i]);if(d<bestDist){bestDist=d;best=i}}if(bestDist>33){$('feedback').textContent='Versuche, auf der grauen Linie zu bleiben.';return}if(best>=progress){progress=best;coords=arr.slice(0,progress+1);renderTrace()}if(progress>=arr.length-5){active=false;completed[stroke].setAttribute('display','');trace.setAttribute('d','');stroke++;update();if(stroke>=samples.length){$('feedback').textContent='Toll gemacht! 🌟';setTimeout(showReward,450)}else $('feedback').textContent='Prima! Jetzt den nächsten blauen Startpunkt suchen.'}}
function up(){if(!active)return;active=false;trace.setAttribute('d','');coords=[];progress=0;$('feedback').textContent='Versuche den Strich noch einmal vom Startpunkt bis zum Ende.'}
board.addEventListener('pointerdown',down);board.addEventListener('pointermove',move);board.addEventListener('pointerup',up);board.addEventListener('pointercancel',up);$('reset').addEventListener('click',loadLetter);
$('demo').addEventListener('click',()=>{loadLetter();$('feedback').textContent='Schau dir die Schreibbewegung an.';let j=0,k=0;function tick(){if(j>=samples.length){stroke=samples.length;update();$('feedback').textContent='Jetzt selbst probieren: Tippe auf „Neu beginnen“.';anim=null;return}coords=samples[j].slice(0,k+1);renderTrace();k+=2;if(k>=samples[j].length){completed[j].setAttribute('display','');trace.setAttribute('d','');j++;k=0;stroke=j;update()}anim=requestAnimationFrame(tick)}tick()});
function showReward(){let i=Math.floor(Math.random()*POKEMON.length);if(i===lastPokemon)i=(i+1)%POKEMON.length;lastPokemon=i;$('pokeImg').src=POKEMON_IMAGES[i];$('pokeName').textContent=POKEMON[i];$('rewardText').textContent=`Du hast das ${LETTERS[letter].name} toll geschrieben!`;$('continue').textContent=letter===LETTERS.length-1?'Noch einmal spielen ↻':'Nächster Buchstabe →';$('overlay').classList.add('show');successSound()}
function advance(){if(letter<LETTERS.length-1)letter++;else letter=0;$('overlay').classList.remove('show');loadLetter()}
$('continue').addEventListener('click',advance);$('next').addEventListener('click',advance);
function successSound(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;let c=new A();[523,659,784].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);let t=c.currentTime+i*.12;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.17);o.start(t);o.stop(t+.18)});setTimeout(()=>c.close(),700)}catch(e){}}
loadLetter();</script></body></html>
